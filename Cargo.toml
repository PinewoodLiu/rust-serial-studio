[package]
name = "serial-assistant"
version = "0.1.4"
edition = "2024"
description = "Rust 中文串口与网络调试助手"
license = "MIT"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serialport = "4.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

